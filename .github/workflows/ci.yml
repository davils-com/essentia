name: CI

# Everything runs through the pipeline of davils-com/workflows: format, analyze and the tests of
# every package on the VM, in Chrome and as WebAssembly (stable and the lowest SDK), the VM tests
# on macOS and Windows, inspectra check of every package and of the workspace root, inspectra scan
# with code scanning, the Writerside documentation and the API reference on GitHub Pages and, on a
# tag <package>-v<version>, the publication of that package to pub.dev and its GitHub release.
# .github/davils-ci.yaml holds what differs from the defaults.
#
# GitHub starts no workflow when more than three tags arrive in one push; push the tags of a
# release of several packages three at a time (tools/push-tags.sh of davils-com/workflows).
on:
  push:
    branches: ['**']
    tags: ['*-v*']
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]
  merge_group:
  schedule:
    # New vulnerabilities are published for dependencies nobody touched.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  pipeline:
    name: Pipeline
    uses: davils-com/workflows/.github/workflows/pipeline.yml@83c9ea9d6fdaa0d66082ee04a0d8e54e245315a0 # develop
    # GitHub checks the permissions of every job the pipeline could run before it starts, so it
    # gets all of them; every job inside takes only what it needs.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: write
      security-events: write
      pages: write
      id-token: write
      attestations: write
    secrets: inherit
