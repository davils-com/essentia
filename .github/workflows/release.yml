name: Release

# A tag `<package>-v<version>` publishes that package to pub.dev, for example
# `essentia_core-v1.0.0`. pub.dev accepts the upload through the OpenID
# Connect token of this workflow; every package names this repository, the
# tag pattern `<package>-v{{version}}` and the environment `pub.dev` in its
# automated publishing settings.
on:
  push:
    tags:
      - 'essentia_core-v*'
      - 'essentia_compression-v*'
      - 'essentia_time-v*'
      - 'essentia_coroutines-v*'
      - 'essentia_io-v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The package and the version come from the tag; the version has to be
      # the one of the package's pubspec.yaml, and the tagged commit has to be
      # on main, the release branch.
      - name: Read the tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          package="${tag%%-v*}"
          version="${tag#"${package}"-v}"
          case "$package" in
            essentia_core | essentia_compression | essentia_time | essentia_coroutines | essentia_io) ;;
            *)
              echo "::error::The tag $tag names no package of the workspace."
              exit 1
              ;;
          esac
          declared=$(grep '^version:' "$package/pubspec.yaml" | awk '{print $2}')
          if [ "$declared" != "$version" ]; then
            echo "::error::The tag $tag does not match version $declared of $package/pubspec.yaml."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $tag is not on main."
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Cache the Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify (format, analyze, style, generated sources, tests)
        run: dart run tool/verify.dart

      - name: inspectra check (${{ steps.tag.outputs.package }})
        run: dart run inspectra -C "${{ steps.tag.outputs.package }}" check

      - name: inspectra check (workspace)
        run: dart run inspectra check

      # The release description is the section of the tagged version in the
      # package's CHANGELOG.md; the release stops here when it is missing or
      # empty.
      - name: Release notes
        run: >-
          dart run inspectra -C "${{ steps.tag.outputs.package }}"
          changelog notes "${{ steps.tag.outputs.version }}"
          --output "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Dry run
        working-directory: ${{ steps.tag.outputs.package }}
        run: dart pub publish --dry-run

      - name: Upload the release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/RELEASE_NOTES.md
          retention-days: 7

  publish:
    name: Publish to pub.dev
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    environment:
      name: pub.dev
      url: https://pub.dev/packages/${{ needs.verify.outputs.package }}/versions/${{ needs.verify.outputs.version }}

    env:
      PACKAGE: ${{ needs.verify.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With the id-token permission, setup-dart hands pub the OpenID Connect
      # token of this job, so no credential is stored anywhere.
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      # The packages go up in the order of the layers. When the tags of several
      # packages are pushed together, a package waits here until the lowest
      # version of every sibling it depends on is on pub.dev.
      - name: Wait for the siblings on pub.dev
        shell: bash
        run: |
          siblings=$(sed -n '/^dependencies:/,/^[^ ]/p' "$PACKAGE/pubspec.yaml" \
            | sed -nE 's/^  (essentia_[a-z_]+): *\^?([0-9][^ ]*).*$/\1 \2/p')
          while read -r sibling version; do
            [ -n "$sibling" ] || continue
            for attempt in $(seq 1 60); do
              if curl -fsS -o /dev/null "https://pub.dev/api/packages/$sibling/versions/$version"; then
                echo "$sibling $version is on pub.dev."
                continue 2
              fi
              echo "Waiting for $sibling $version on pub.dev ($attempt/60)."
              sleep 30
            done
            echo "::error::$sibling $version did not reach pub.dev."
            exit 1
          done <<< "$siblings"

      - name: Resolve dependencies
        run: dart pub get

      - name: Publish
        working-directory: ${{ env.PACKAGE }}
        run: dart pub publish --force

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: dist

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.verify.outputs.package }} ${{ needs.verify.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
