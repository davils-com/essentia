include: package:inspectra/lints/strict.yaml

analyzer:
  errors:
    unawaited_futures: error
    discarded_futures: error
    public_member_api_docs: error
    no_default_cases: error
    exhaustive_cases: error
    avoid_dynamic_calls: error
  exclude:
    - build/**
    - .dart_tool/**

linter:
  rules:
    avoid_catches_without_on_clauses: true
    avoid_void_async: true
    comment_references: true
    document_ignores: true
    literal_only_boolean_expressions: true
    missing_code_block_language_in_doc_comment: true
    no_default_cases: true
    public_member_api_docs: true
    throw_in_finally: true
    unintended_html_in_doc_comment: true
    use_late_for_private_fields_and_variables: false
