name: essentia_io
description: >-
  Byte input and output for Dart on Essentia's coroutines: a segmented
  buffer, byte channels with back pressure that a
  writer and a reader share, reading lines and numbers, scanning for a
  delimiter, writer and reader coroutines, and bridges to Dart's streams.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  essentia_core:
    path: ../essentia_core
  essentia_coroutines:
    path: ../essentia_coroutines
  meta: ^1.16.0

dev_dependencies:
  inspectra:
    path: ../../inspectra
  test: ^1.30.0

# The gates of inspectra.base.yaml.
inspectra:
  extends: ../inspectra.base.yaml
  changelog:
    tag_prefix: essentia_io-v
