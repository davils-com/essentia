name: essentia_compression
description: >-
  gzip, deflate and Brotli decoding with CRC-32 and Adler-32 checks, on
  every Dart platform.
version: 1.0.0
repository: https://github.com/davils-com/essentia/tree/main/essentia_compression
issue_tracker: https://github.com/davils-com/essentia/issues
homepage: https://www.davils.com
topics:
  - compression
  - gzip
  - brotli
  - deflate
  - checksum
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  meta: ^1.16.0

dev_dependencies:
  inspectra: ^2.1.0
  test: ^1.30.0

# The gates of inspectra.base.yaml.
inspectra:
  extends: ../inspectra.base.yaml
  changelog:
    tag_prefix: essentia_compression-v
