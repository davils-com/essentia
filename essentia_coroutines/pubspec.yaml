name: essentia_coroutines
description: >-
  Kotlin's coroutines for Dart, ported from kotlinx-coroutines: structured
  concurrency, channels, select, hot flows on Dart's Stream, fair locks,
  an in-process event bus and a virtual event loop for tests.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  essentia_core: ^1.0.0
  essentia_time: ^1.0.0
  meta: ^1.16.0

dev_dependencies:
  inspectra:
    path: ../../inspectra
  test: ^1.30.0

# The gates of inspectra.base.yaml.
inspectra:
  extends: ../inspectra.base.yaml
  changelog:
    tag_prefix: essentia_coroutines-v
