name: essentia_core
description: >-
  Validation, configuration builders, program parameters, identifiers,
  versions and extensions on Dart's own classes.
version: 1.0.0
repository: https://github.com/davils-com/essentia/tree/main/essentia_core
issue_tracker: https://github.com/davils-com/essentia/issues
homepage: https://www.davils.com
topics:
  - validation
  - configuration
  - cli
  - semver
  - extensions
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  meta: ^1.16.0

dev_dependencies:
  inspectra: ^2.1.0
  test: ^1.30.0

# The gates of inspectra.base.yaml.
inspectra:
  extends: ../inspectra.base.yaml
  changelog:
    tag_prefix: essentia_core-v
