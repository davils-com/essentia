# Trivy secret scanning rules for Essentia.
# https://trivy.dev/latest/docs/scanner/secret/
#
# Every built-in rule stays enabled. Naming rules under `enable-builtin-rules`
# would turn the others off, so a rule is turned off here, by id under
# `disable-rules`, only once it has actually produced a false positive.

disable-allow-rules:
  - usr-dirs
  # Trivy skips every Markdown file through this built-in rule. The README and
  # the guides are full of worked examples, which is exactly where a credential
  # gets pasted, so they are scanned like the code.
  - markdown

rules:
  - id: dart-hardcoded-credential
    category: Dart
    title: Hard-coded credential in Dart source
    severity: HIGH
    # Dart quotes strings with ' as often as with ", and hands a credential
    # over in three shapes: a variable (`token = '...'`), a named argument
    # (`token: '...'`) and a map entry (`'token': '...'`). The value class
    # holds . and = so that a JWT and padded base64 are caught too.
    regex: (?i)(api_?key|token|secret|password)[a-z0-9_]*['"]?\s*[:=]\s*['"](?P<secret>[A-Za-z0-9_/+=.\-]{12,})['"]
    secret-group-name: secret
    keywords:
      - apikey
      - api_key
      - token
      - secret
      - password
